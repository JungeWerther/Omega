# Landlock policy for running Omega without Docker, from the PeTTa checkout
# (`sh run.sh run.metta` in the PeTTa directory). Relative paths are relative
# to that directory; `~` and $VARIABLES are expanded. The Docker image uses
# policy.yaml instead (passed by scripts/omega).
version: 1
filesystem_policy:
  include_workdir: false
  # Read access to the interpreter's prefix and site-packages, wherever the
  # Python environment lives (system, venv, conda, ~/.local).
  include_python_runtime: true
  read_only:
  - /bin
  - /usr
  - /lib
  - {path: /lib64, optional: true}
  - /etc
  - /proc
  - /dev/urandom
  - /sys/devices/system
  # The PeTTa checkout: interpreter, libraries, Omega code and prompts.
  - .
  - {path: "${HF_HOME}", optional: true}
  - {path: "${SENTENCE_TRANSFORMERS_HOME}", optional: true}
  read_write:
  - {path: ./repos/Omega/memory, create: true}
  - {path: ./chroma_db, create: true}
  - /tmp
  - {path: /var/tmp, optional: true}
  - /dev/null
  - {path: /dev/shm, optional: true}
  - {path: ~/.cache/huggingface, optional: true}
  - {path: ~/.cache/torch, optional: true}
landlock:
  compatibility: best_effort
