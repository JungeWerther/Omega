version: 1
filesystem_policy:
  include_workdir: false
  read_only:
  - /bin
  - /usr
  - /lib
  - /proc
  - /dev/urandom
  - /etc
  - /opt
  - /var/log
  - /sys/devices/system
  - /PeTTa
  read_write:
  - /PeTTa/repos/Omega/memory
  - /memory-transfer
  - /tmp
  - /dev/null
  - /opt/huggingface
  - /opt/sentence_transformers
  - /var/tmp
  - /dev/shm
network_policy:
  # The only TCP ports the agent may connect to (all on 127.0.0.1): nginx
  # (LLM providers), the gate (chat) and the egress proxy (allowlisted
  # HTTPS). Binding TCP ports is denied. Needs Landlock ABI 4 (Linux 6.7+);
  # without it the agent refuses to start unless allowUnrestrictedNetwork.
  connect_tcp:
  - 8080
  - 8090
  - 3128
landlock:
  # best_effort: drop access flags the host kernel's Landlock ABI does not
  # know (older kernels). Landlock itself is always required: without it,
  # or if the post-apply self-test fails, the agent exits instead of running
  # unsandboxed (see profile/policy.py, allowUnsandboxed).
  compatibility: best_effort
